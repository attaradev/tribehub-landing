    </g>
    <rect x="0" y="0" width="360" height="360" rx="40" fill="url(#cardGlow)" opacity=".9"/>
    <rect x="24" y="36" width="312" height="96" rx="20" fill="#F8FAFC" opacity=".92"/>
    <rect x="24" y="152" width="312" height="96" rx="20" fill="#F1F5F9" opacity=".92"/>
    <rect x="24" y="268" width="312" height="50" rx="18" fill="#E0F2FE" opacity=".85"/>
    <text
