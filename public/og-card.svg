  </text>
  <text
    x="240"
    y="320"
    fill="#0F172A"
    font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="80"
    font-weight="700"
  >
    Build the command
  </text>
  <text
    x="240"
    y="400"
    fill="#0F172A"
    font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="80"
    font-weight="700"
  >
    center your community
  </text>
  <text
    x="240"
    y="480"
    fill="#0F172A"
    font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif"
