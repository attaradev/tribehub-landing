  </text>
  <rect x="240" y="210" width="220" height="44" rx="22" fill="url(#pillGradient)"/>
  <text
    x="260"
    y="240"
    fill="#fff"
    font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="500"
