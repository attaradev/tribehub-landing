<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="0.45" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#E0F2FE"/>
    </linearGradient>
    <linearGradient id="pillGradient" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cardGlow" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="rgba(37,99,235,0.15)"/>
      <stop offset="1" stop-color="rgba(124,58,237,0.05)"/>
    </linearGradient>
    <filter id="cardShadow" x="-8%" y="-16%" width="116%" height="148%" filterUnits="objectBoundingBox">
      <feOffset dy="16" in="SourceAlpha" result="shadowOffsetOuter1"/>
      <feGaussianBlur stdDeviation="24" in="shadowOffsetOuter1" result="shadowBlurOuter1"/>
      <feColorMatrix
        in="shadowBlurOuter1"
        values="0 0 0 0 0.149 0 0 0 0 0.204 0 0 0 0 0.431 0 0 0 0.15 0"
      />
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  <g opacity=".3">
    <circle cx="1050" cy="120" r="210" fill="#C7D2FE"/>
    <circle cx="210" cy="540" r="240" fill="#BFDBFE"/>
    <circle cx="930" cy="510" r="150" fill="#DDD6FE"/>
  </g>
  <g transform="translate(120 120)">
    <rect x="0" y="0" width="102" height="102" rx="28" fill="#2563EB"/>
    <text
      x="33"
      y="70"
      fill="#FFF"
      font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif"
      font-size="56"
      font-weight="700"
    >
      T
    </text>
  </g>
  <text
    x="240"
    y="185"
    fill="#0F172A"
    font-family="'Geist', 'Inter', 'Helvetica Neue', Arial, sans-serif"
    font-size="48"
    font-weight="600"
  >
